# 4G like UWidgets: a Compose-UI-on-canvas js target bundles skiko, which does not fit in 2G.
# No kotlin.daemon.jvmargs on purpose (see UWidgets' gradle.properties for the rationale).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
# Configuration cache: a --no-daemon stage of `gndx gradle run` reuses the entry from disk, which cut
# each stage's start-up from ~17s to ~9s on UWidgets (luagnd docs/track/gradle-babysitter/issues/08).
org.gradle.configuration-cache=true
